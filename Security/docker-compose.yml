services:
  security:
    build:
      context: .
      dockerfile: Dockerfile
    image: deplai-security
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - HOST_PROJECTS_DIR=${HOST_PROJECTS_DIR}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOST_PROJECTS_DIR}:/local-projects:ro
    networks:
      - deplai
    restart: unless-stopped

networks:
  deplai:
    driver: bridge
